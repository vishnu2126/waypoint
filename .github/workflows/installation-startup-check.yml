name: Installation and startup check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-application:
    name: Install, test, build, and start application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Start application and verify response
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG_FILE="${RUNNER_TEMP}/waypoint-vite.log"

          npm run dev -- --host 127.0.0.1 --port 4173 > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            echo "Application log:"
            cat "$LOG_FILE" || true
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/ > /dev/null; then
              echo "Application started successfully."
              exit 0
            fi

            echo "Waiting for application startup: attempt $attempt/30"
            sleep 2
          done

          echo "Application did not respond within 60 seconds."
          exit 1
